[package]
name = "rustberny"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Molecular geometry optimizer using rational function optimization"

[workspace]
members = ["."]

[workspace.dependencies]
nalgebra = "0.35"
once_cell = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
itertools = "0.14"

[dependencies]
nalgebra.workspace = true
once_cell.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
num-complex.workspace = true
itertools.workspace = true
